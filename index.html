<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zum Hören – FREIHAND</title>
  <meta name="description" content="Hörstation zur Ausstellung FREIHAND. Schrift, Schule, Gemeinschaft im Mitte Museum.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fde7e2">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <a class="sprunglink" href="#inhalt">Zum Inhalt springen</a>

  <header class="kopf">
    <a class="kopf-marke" href="#/">
      <span id="kopf-titel" class="kopf-titel"></span>
      <span id="kopf-unter" class="kopf-unter"></span>
    </a>
    <span id="kopf-ort" class="kopf-ort"></span>
  </header>

  <main id="inhalt" tabindex="-1"></main>

  <footer id="fuss" class="fuss" hidden></footer>

  <!-- Großansicht für Bilder -->
  <dialog id="lightbox" class="lightbox" aria-label="Bildansicht">
    <button type="button" class="lb-zu" id="lb-zu" aria-label="Großansicht schließen">&times;</button>
    <figure class="lb-figur">
      <img id="lb-bild" alt="">
      <figcaption id="lb-text"></figcaption>
    </figure>
    <div class="lb-steuerung">
      <button type="button" id="lb-zurueck" class="rund" aria-label="Voriges Bild">&#8249;</button>
      <span id="lb-zaehler" class="zaehler" aria-live="polite"></span>
      <button type="button" id="lb-weiter" class="rund" aria-label="Nächstes Bild">&#8250;</button>
    </div>
  </dialog>

  <noscript><p class="ohne-js">Diese Hörstation braucht JavaScript.</p></noscript>

  <script src="assets/js/kapitel.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
